# Optional: local Neo4j in Docker (same as Neo4j Desktop, one command).
#   docker compose up -d        → browser UI at http://localhost:7474
#   docker compose down         → stops it; data stays in the named volume
# No plugins needed (no APOC / GDS): graph algorithms run in Python.
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: blueorbit-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt (what the API connects to)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - blueorbit_neo4j_data:/data
      - ./backups:/backups

volumes:
  blueorbit_neo4j_data:
    external: false
